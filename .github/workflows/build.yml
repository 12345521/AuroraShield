name: Build AuroraShield KPM

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup NDK
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r29
        
    - name: Download KernelPatch
      run: |
        git clone --depth=1 https://github.com/bmax121/KernelPatch.git
        mv KernelPatch ../KernelPatch-0.11.3
        
    - name: Build KPM
      run: |
        export KP_DIR=$(pwd)/../KernelPatch-0.11.3
        export NDK_PATH=$ANDROID_NDK_HOME
        make
        
    - name: Upload KPM
      uses: actions/upload-artifact@v4
      with:
        name: AuroraShield.kpm
        path: AuroraShield.kpm
